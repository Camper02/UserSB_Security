server:
  port: 8080 # Порт, на котором запустится приложение

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://localhost:7777/UserDB
    username: postgres
    password: 123456
  jpa:
    hibernate:
      ddl-auto: create # Аналог hibernate.hbm2ddl.auto
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  thymeleaf:
    cache: false   # отключаем кэш шаблонов во время разработки
    encoding: UTF-8
    mode: HTML

    # Ошибки в процессе работы
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.security.authentication: DEBUG

